<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2433">
<title>Barkod Depo</title>
<script>
  // >>> Google Apps Script "Web uygulaması URL"si buraya (…/exec ile biter) <<<
  var API_URL = 'https://script.google.com/macros/s/AKfycbwDSdY2A2buzyBXf2xGvf1X3xAEBMjSwGSjSWVbcGl74FEVLd8XFpUr9QcPkehPLgTF/exec';
</script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, Roboto, Arial, sans-serif; margin: 0; background: #f2f4f7; color: #1d2433; font-size: 16px; }
  header { background: #1d2433; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; }
  header small { opacity: .75; }
  header button { background: none; border: 0; color: #fff; font-size: 20px; padding: 0 0 0 10px; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .kart { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-size: 13px; color: #5b6475; margin: 8px 0 4px; }
  input[type=text], input[type=number], input[type=password], select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cdd3dd; border-radius: 8px; background: #fff; color: #1d2433; }
  .mod { display: flex; gap: 6px; }
  .mod button { flex: 1; padding: 12px 4px; font-size: 14px; font-weight: 700; border: 2px solid #cdd3dd; border-radius: 10px; background: #fff; color: #5b6475; }
  .mod button small { font-weight: 400; font-size: 11px; }
  .mod button.secili[data-m="GİRİŞ"] { background: #1e8e3e; border-color: #1e8e3e; color: #fff; }
  .mod button.secili[data-m="TRANSFER"] { background: #e37400; border-color: #e37400; color: #fff; }
  .mod button.secili[data-m="ÇIKIŞ"] { background: #d93025; border-color: #d93025; color: #fff; }
  .mod button.secili[data-m="SAYIM"] { background: #7b1fa2; border-color: #7b1fa2; color: #fff; }
  .farklar { margin-top: 6px; font-size: 14px; }
  .farklar div { padding: 2px 0; }
  .mod button:disabled:not(.secili) { opacity: .4; }
  .satir { display: flex; gap: 8px; align-items: flex-end; }
  .satir > div { flex: 1; }
  .ok-isaret { flex: 0 0 auto !important; padding-bottom: 12px; font-size: 20px; color: #5b6475; }
  .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 700; border: 0; border-radius: 10px; background: #1a73e8; color: #fff; margin-top: 8px; }
  .btn.ikincil { background: #e8eef7; color: #1a73e8; }
  .btn.dar { width: auto; margin-top: 0; padding: 12px 16px; }
  .btn:disabled { background: #a8b3c4; color: #fff; }
  #kameraKutu { position: relative; margin-top: 8px; border-radius: 10px; overflow: hidden; background: #000; display: none; }
  #kameraKutu.acik { display: block; }
  #video { width: 100%; display: block; }
  #cerceve { position: absolute; left: 7%; right: 7%; top: 30%; bottom: 30%; border: 3px solid rgba(255,255,255,.85); border-radius: 10px; box-shadow: 0 0 0 2000px rgba(0,0,0,.35); transition: border-color .15s; }
  #cerceve.okundu { border-color: #34d058; }
  #cerceve.hata { border-color: #ff5a4f; }
  #kameraIpucu { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; text-shadow: 0 1px 2px #000; }
  .mesaj { padding: 10px 12px; border-radius: 8px; margin-top: 8px; font-size: 15px; display: none; }
  .mesaj.ok { background: #e6f4ea; color: #137333; display: block; }
  .mesaj.hata { background: #fce8e6; color: #b3261e; display: block; }
  .mesaj.bilgi { background: #e8f0fe; color: #174ea6; display: block; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 4px; border-bottom: 1px solid #edf0f4; vertical-align: middle; }
  td.ad { font-size: 14px; }
  td.ad small { color: #5b6475; display: block; }
  td.ad .uyari { color: #b3261e; font-weight: 600; display: block; }
  td.adet input { width: 70px; padding: 8px; text-align: center; }
  td.sil button { border: 0; background: none; color: #b3261e; font-size: 22px; padding: 4px 8px; }
  .toplam { text-align: right; font-weight: 700; margin-top: 8px; }
  .bos { color: #8a93a3; text-align: center; padding: 16px 0; }
  .gizli { display: none !important; }
  #girisEkrani { max-width: 420px; margin: 40px auto; }
  /* Raporlar */
  .sekmeler { display: flex; gap: 6px; margin-bottom: 8px; }
  .sekmeler button { flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 700; border: 2px solid #cdd3dd; border-radius: 10px; background: #fff; color: #5b6475; }
  .sekmeler button.secili { background: #1d2433; border-color: #1d2433; color: #fff; }
  .filtre { display: flex; gap: 6px; margin-bottom: 8px; }
  .filtre input[type=text] { flex: 1; }
  .filtre select { width: auto; flex: 0 0 auto; }
  .filtre label { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
  .rsatir { padding: 9px 2px; border-bottom: 1px solid #edf0f4; font-size: 14px; }
  .rsatir .ust { display: flex; justify-content: space-between; gap: 8px; }
  .rsatir .alt { color: #5b6475; font-size: 12px; margin-top: 2px; }
  .rsatir b.eksi { color: #b3261e; }
  .rozet { display: inline-block; padding: 1px 6px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; }
  .rozet.GİRİŞ { background: #1e8e3e; } .rozet.TRANSFER { background: #e37400; } .rozet.ÇIKIŞ { background: #d93025; } .rozet.SAYIM { background: #7b1fa2; }
  .yerler { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px; text-align: center; font-size: 12px; color: #5b6475; }
  .yerler b { display: block; font-size: 15px; color: #1d2433; }
  .yerler b.eksi { color: #b3261e; }
  .fislink { color: #1a73e8; text-decoration: underline; }
  #raporBilgi { font-size: 12px; color: #5b6475; margin: 4px 0 8px; }
  .tarihler { display: flex; gap: 6px; margin-bottom: 6px; }
  .tarihler input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #cdd3dd; border-radius: 8px; min-width: 0; }
  .hizli { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .hizli button { flex: 1; padding: 8px 4px; font-size: 13px; border: 1px solid #cdd3dd; border-radius: 8px; background: #fff; color: #1d2433; }
  .hizli button.secili { background: #e8eef7; border-color: #1a73e8; color: #1a73e8; font-weight: 700; }
  .silbtn { border: 0; background: none; color: #b3261e; font-size: 13px; padding: 2px 0 2px 8px; text-decoration: underline; }
  .btn.yesil { background: #1e8e3e; }
  .btn.kirmizi { background: #d93025; }
</style>
</head>
<body>
<header>
  <h1>Barkod Depo</h1>
  <div><small id="durum">Yükleniyor…</small><button id="raporBtn" class="gizli" onclick="raporAcKapat()" title="Raporlar">📊</button><button onclick="ayarlar()" title="Ayarlar">⚙</button></div>
</header>

<main>
  <!-- PIN ekranı -->
  <div id="girisEkrani" class="kart gizli">
    <strong>Giriş</strong>
    <label>PIN kod</label>
    <input type="password" id="pinGir" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')pinKaydet()">
    <button class="btn" onclick="pinKaydet()">Bağlan</button>
    <div id="girisMesaj" class="mesaj"></div>
  </div>

  <!-- Raporlar (salt okunur) -->
  <div id="raporlar" class="kart gizli">
    <div class="satir" style="align-items:center;margin-bottom:8px"><div><strong>Raporlar</strong></div><button class="btn dar ikincil" onclick="raporAcKapat()">← Okutmaya dön</button></div>
    <div class="sekmeler">
      <button data-r="stok" class="secili" onclick="raporSec('stok')">Stok</button>
      <button data-r="hareket" onclick="raporSec('hareket')">Hareketler</button>
      <button data-r="sayim" onclick="raporSec('sayim')">Sayımlar</button>
    </div>
    <div id="tarihFiltre" class="gizli">
      <div class="hizli">
        <button data-h="bugun" onclick="hizliTarih('bugun')">Bugün</button>
        <button data-h="dun" onclick="hizliTarih('dun')">Dün</button>
        <button data-h="hafta" onclick="hizliTarih('hafta')">Bu hafta</button>
        <button data-h="ay" onclick="hizliTarih('ay')">Bu ay</button>
        <button data-h="tumu" onclick="hizliTarih('tumu')">Tümü</button>
      </div>
      <div class="tarihler">
        <input type="date" id="tarihBas" onchange="tarihDegisti()">
        <input type="date" id="tarihBit" onchange="tarihDegisti()">
      </div>
    </div>
    <div class="filtre">
      <input type="text" id="raporAra" placeholder="Ara: ürün, kod, fiş, müşteri…" oninput="raporCiz()" autocomplete="off">
      <select id="raporTur" class="gizli" onchange="raporCiz()"><option value="">Tümü</option><option>GİRİŞ</option><option>TRANSFER</option><option>ÇIKIŞ</option><option>SAYIM</option></select>
    </div>
    <div class="filtre" id="stokFiltre">
      <label><input type="checkbox" id="sadeceStoklu" onchange="raporCiz()"> Sadece stoğu olanlar</label>
      <select id="yerFiltre" onchange="raporCiz()"><option value="">Tüm yerler</option></select>
    </div>
    <div id="raporBilgi"></div>
    <button class="btn kirmizi gizli" id="fisSilBtn" onclick="fisSil()">Bu fişi tamamen sil</button>
    <div id="raporListe"></div>
    <button class="btn yesil" onclick="excelIndir()">⬇ Excel (.xlsx) indir</button>
    <button class="btn ikincil" onclick="raporYukle()">↻ Yenile</button>
  </div>

  <div id="uygulama" class="gizli">
    <div class="kart">
      <label style="margin-top:0">İşlem</label>
      <div class="mod">
        <button data-m="GİRİŞ" class="secili" onclick="modSec('GİRİŞ')">GİRİŞ<br><small>Montajdan</small></button>
        <button data-m="TRANSFER" onclick="modSec('TRANSFER')">TRANSFER<br><small>Yerler arası</small></button>
        <button data-m="ÇIKIŞ" onclick="modSec('ÇIKIŞ')">ÇIKIŞ<br><small>Müşteriye</small></button>
        <button data-m="SAYIM" onclick="modSec('SAYIM')">SAYIM<br><small>Raf sayımı</small></button>
      </div>

      <div class="satir">
        <div id="kaynakKutu"><label id="kaynakEtiket">Nereden</label><select id="kaynak" onchange="yerDegisti()"></select></div>
        <div class="ok-isaret" id="okIsaret">→</div>
        <div id="hedefKutu"><label>Nereye</label><select id="hedef" onchange="yerDegisti()"></select></div>
      </div>
      <div id="kilitNot" class="mesaj bilgi gizli">İşlemi veya yeri değiştirmek için önce listeyi kaydedin ya da temizleyin.</div>

      <label>Okutan kişi</label>
      <input type="text" id="okutan" placeholder="Adınız" oninput="taslakYaz()">

      <label id="notEtiket">Not (isteğe bağlı)</label>
      <input type="text" id="not" oninput="taslakYaz()">
    </div>

    <div class="kart">
      <button class="btn" id="kameraBtn" onclick="kameraAcKapat()">📷 Kamerayı Aç</button>
      <div id="kameraKutu">
        <video id="video" playsinline muted autoplay></video>
        <div id="cerceve"></div>
        <div id="kameraIpucu">Barkodu çerçevenin içine tutun</div>
      </div>
      <button class="btn ikincil" onclick="document.getElementById('foto').click()">Fotoğraf çekerek okut</button>
      <input type="file" id="foto" accept="image/*" capture="environment" class="gizli" onchange="fotoOku(this)">

      <label>Barkod veya stok kodu (el okuyucu da buraya yazar)</label>
      <div class="satir">
        <div><input type="text" id="elle" placeholder="Barkod / stok kodu" autocomplete="off" onkeydown="if(event.key==='Enter'){elleEkle();}"></div>
        <button class="btn dar" onclick="elleEkle()">Ekle</button>
      </div>
      <div id="mesaj" class="mesaj"></div>
      <div id="sayimSonuc" class="mesaj bilgi gizli"></div>
    </div>

    <div class="kart">
      <strong id="listeBaslik">Liste</strong>
      <table><tbody id="liste"></tbody></table>
      <div id="bosListe" class="bos">Henüz ürün okutulmadı.</div>
      <div class="toplam" id="toplam"></div>
      <button class="btn" id="kaydetBtn" onclick="kaydet()" disabled>Fişi Kaydet</button>
      <button class="btn ikincil" onclick="listeyiTemizle()">Listeyi Temizle</button>
    </div>
  </div>
</main>

<script>
  var FORMATLAR = ['EAN13', 'EAN8', 'Code128', 'Code39', 'UPCA', 'UPCE', 'ITF', 'QRCode', 'DataMatrix'];
  var HAFIZA = 'barkodDepoV2';
  var durum = { pin: '', mod: 'GİRİŞ', kaynak: '', hedef: 'DEPO', okutan: '', not: '', liste: [] };
  var yerler = ['DEPO', 'E-TİCARET', 'BAYİ'];
  var urunByKey = {}, stok = {};

  /* ================= Hafıza (telefonda kalır) ================= */
  function taslakYaz() {
    durum.okutan = el('okutan').value; durum.not = el('not').value;
    try { localStorage.setItem(HAFIZA, JSON.stringify(durum)); } catch (e) {}
  }
  function taslakOku() {
    try { var t = JSON.parse(localStorage.getItem(HAFIZA) || 'null'); if (t) durum = Object.assign(durum, t); } catch (e) {}
  }

  /* ================= Sunucu ================= */
  function api(yontem, veri) {
    if (API_URL.indexOf('http') !== 0) return Promise.reject(new Error('index.html içinde API_URL ayarlanmamış.'));
    var istek = yontem === 'GET'
      ? fetch(API_URL + '?islem=veri&pin=' + encodeURIComponent(durum.pin))
      : fetch(API_URL, { method: 'POST', body: JSON.stringify(veri) }); // text/plain: Google ile uyumlu
    return istek.then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.hata || 'Bilinmeyen hata');
      return j;
    });
  }

  function yukle() {
    el('durum').textContent = 'Bağlanıyor…';
    return api('GET').then(function (j) {
      var v = j.veri;
      yerler = v.yerler; stok = v.stok || {}; urunByKey = {};
      v.urunler.forEach(function (u) { anahtarEkle(u.kod, u); u.barkodlar.forEach(function (b) { anahtarEkle(b, u); }); });
      el('durum').textContent = v.urunler.length + ' ürün';
      el('girisEkrani').classList.add('gizli'); el('uygulama').classList.remove('gizli'); el('raporBtn').classList.remove('gizli');
      yerleriDoldur(); ekraniKur();
    }).catch(function (e) {
      el('durum').textContent = 'Bağlantı yok';
      if (/PIN/.test(e.message) || !durum.pin) { girisGoster(e.message === 'PIN hatalı.' ? 'PIN hatalı.' : (durum.pin ? e.message : '')); }
      else { el('uygulama').classList.remove('gizli'); mesaj('Sunucuya bağlanılamadı: ' + e.message + ' — İnterneti kontrol edip sayfayı yenileyin.', 'hata'); }
    });
  }

  function girisGoster(hata) {
    el('uygulama').classList.add('gizli'); el('girisEkrani').classList.remove('gizli');
    var m = el('girisMesaj'); if (hata) { m.textContent = hata; m.className = 'mesaj hata'; } else m.className = 'mesaj';
  }
  function pinKaydet() { durum.pin = el('pinGir').value.trim(); taslakYaz(); yukle(); }
  function ayarlar() {
    if (durum.liste.length) { mesaj('PIN değiştirmek için önce listeyi kaydedin.', 'bilgi'); return; }
    kameraKapat(); durum.pin = ''; durum.ypin = ''; taslakYaz(); el('pinGir').value = ''; el('raporlar').classList.add('gizli'); el('raporBtn').classList.add('gizli'); girisGoster('');
  }

  /* ================= Ürün arama ================= */
  function normal(s) { return String(s || '').replace(/\s+/g, '').toUpperCase(); }
  function anahtarEkle(k, u) {
    k = normal(k); if (!k) return;
    urunByKey[k] = u;
    var z = k.replace(/^0+/, ''); if (z && !urunByKey[z]) urunByKey[z] = u;
  }
  function bul(k) { k = normal(k); return urunByKey[k] || urunByKey[k.replace(/^0+/, '')] || null; }

  /* ================= İşlem ve yer seçimi ================= */
  function yerleriDoldur() {
    ['kaynak', 'hedef'].forEach(function (id) {
      el(id).innerHTML = yerler.map(function (y) { return '<option>' + esc(y) + '</option>'; }).join('');
    });
  }

  function modSec(m) {
    if (durum.liste.length && m !== durum.mod) return;
    durum.mod = m;
    if (m === 'GİRİŞ') { durum.kaynak = ''; if (!durum.hedef) durum.hedef = yerler[0]; }
    if (m === 'ÇIKIŞ' || m === 'SAYIM') { durum.hedef = ''; if (!durum.kaynak) durum.kaynak = yerler[0]; }
    if (m === 'TRANSFER') {
      if (!durum.kaynak) durum.kaynak = yerler[0];
      if (!durum.hedef || durum.hedef === durum.kaynak) durum.hedef = yerler.filter(function (y) { return y !== durum.kaynak; })[0];
    }
    ekraniKur();
  }

  function yerDegisti() {
    durum.kaynak = durum.mod === 'GİRİŞ' ? '' : el('kaynak').value;
    durum.hedef = (durum.mod === 'ÇIKIŞ' || durum.mod === 'SAYIM') ? '' : el('hedef').value;
    if (durum.mod === 'TRANSFER' && durum.kaynak === durum.hedef) mesaj('Nereden ve nereye aynı olamaz.', 'hata');
    ekraniKur();
  }

  function ekraniKur() {
    var m = durum.mod, kilitli = durum.liste.length > 0;
    document.querySelectorAll('.mod button').forEach(function (b) {
      b.classList.toggle('secili', b.getAttribute('data-m') === m);
      b.disabled = kilitli && b.getAttribute('data-m') !== m;
    });
    el('kaynakKutu').classList.toggle('gizli', m === 'GİRİŞ');
    el('hedefKutu').classList.toggle('gizli', m === 'ÇIKIŞ' || m === 'SAYIM');
    el('kaynakEtiket').textContent = m === 'SAYIM' ? 'Sayılan yer' : 'Nereden';
    el('okIsaret').classList.toggle('gizli', m !== 'TRANSFER');
    if (durum.kaynak) el('kaynak').value = durum.kaynak;
    if (durum.hedef) el('hedef').value = durum.hedef;
    el('kaynak').disabled = el('hedef').disabled = kilitli;
    el('kilitNot').classList.toggle('gizli', !kilitli);
    el('okutan').value = durum.okutan || '';
    el('not').value = durum.not || '';
    el('notEtiket').textContent = m === 'ÇIKIŞ' ? 'Müşteri / Sipariş / İrsaliye No (zorunlu)' : 'Not (isteğe bağlı)';
    el('not').placeholder = m === 'ÇIKIŞ' ? 'Örn. ABC Ltd / Trendyol 12345' : (m === 'SAYIM' ? 'Örn. A rafı' : 'Örn. iş emri no');
    var baslik = { 'GİRİŞ': 'Giriş: Montaj → ' + durum.hedef, 'TRANSFER': 'Transfer: ' + durum.kaynak + ' → ' + durum.hedef, 'ÇIKIŞ': 'Çıkış: ' + durum.kaynak + ' → Müşteri', 'SAYIM': 'Sayım: ' + durum.kaynak };
    el('listeBaslik').textContent = baslik[m];
    listeyiCiz();
  }

  /* ================= Okutma ================= */
  function okundu(kodMetni) {
    if (!Object.keys(urunByKey).length) {
      sinyal(false); cerceveRenk('hata');
      mesaj('Ürün listesi yüklenmedi (sunucuya bağlanılamadı). İnterneti kontrol edip sayfayı yenileyin.', 'hata');
      return false;
    }
    var u = bul(kodMetni);
    if (!u) {
      sinyal(false); cerceveRenk('hata');
      mesaj('Bulunamadı: ' + kodMetni + ' — bu barkod "Urunler" sayfasında yok.', 'hata');
      return false;
    }
    var satir = durum.liste.filter(function (s) { return s.kod === u.kod; })[0];
    if (satir) satir.adet += 1;
    else durum.liste.unshift({ kod: u.kod, ad: u.ad, barkod: normal(kodMetni), adet: 1 });
    sinyal(true); cerceveRenk('okundu');
    mesaj('✓ ' + u.ad + ' (' + u.kod + ') — listede: ' + (satir ? satir.adet : 1), 'ok');
    ekraniKur();
    return true;
  }

  function elleEkle() {
    var g = el('elle'), v = g.value.trim();
    if (!v) return;
    okundu(v); g.value = ''; g.focus();
  }

  /* ---- Canlı kamera: zxing-wasm ile kare kare okuma ---- */
  var akis = null, taraniyor = false, sonKod = '', sonGorulme = 0;
  var tuval = document.createElement('canvas'), ctx2d = tuval.getContext('2d', { willReadFrequently: true });

  function kameraAcKapat() { if (akis) kameraKapat(); else kameraAc(); }

  function kameraAc() {
    if (typeof ZXingWASM === 'undefined') { mesaj('Barkod okuyucu yüklenemedi. İnterneti kontrol edip sayfayı yenileyin.', 'hata'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { mesaj('Bu tarayıcı kamerayı desteklemiyor. Safari veya Chrome kullanın.', 'hata'); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then(function (s) {
        akis = s;
        var v = el('video'); v.srcObject = s; v.play();
        el('kameraKutu').classList.add('acik');
        el('kameraBtn').textContent = '⏹ Kamerayı Kapat';
        sesHazirla();
        taraniyor = true; kareOku();
      })
      .catch(function (e) {
        mesaj('Kamera açılamadı (' + (e.name || e) + '). Tarayıcıya kamera izni verin: iPhone\'da Ayarlar → Safari → Kamera → İzin Ver.', 'hata');
      });
  }

  function kameraKapat() {
    taraniyor = false;
    if (akis) { akis.getTracks().forEach(function (t) { t.stop(); }); akis = null; }
    el('kameraKutu').classList.remove('acik');
    el('kameraBtn').textContent = '📷 Kamerayı Aç';
  }

  function kareOku() {
    if (!taraniyor) return;
    var v = el('video');
    if (v.readyState < 2 || !v.videoWidth) { setTimeout(kareOku, 150); return; }
    // Yalnızca çerçevenin kapsadığı orta bandı oku (hızlı ve doğru ürün)
    var vw = v.videoWidth, vh = v.videoHeight;
    var sx = Math.round(vw * 0.04), sw = vw - 2 * sx, sy = Math.round(vh * 0.22), sh = vh - 2 * sy;
    var olcek = Math.min(1, 1280 / sw);
    tuval.width = Math.round(sw * olcek); tuval.height = Math.round(sh * olcek);
    ctx2d.drawImage(v, sx, sy, sw, sh, 0, 0, tuval.width, tuval.height);
    var veri = ctx2d.getImageData(0, 0, tuval.width, tuval.height);
    ZXingWASM.readBarcodes(veri, { formats: FORMATLAR, tryHarder: true, tryRotate: true, maxNumberOfSymbols: 1 })
      .then(function (s) {
        var r = s.filter(function (x) { return x.isValid && x.text; })[0];
        var simdi = Date.now();
        if (r) {
          var k = normal(r.text);
          // Aynı barkod kamerada durdukça tekrar sayılmaz; kadrajdan çıkıp yeniden gösterilince sayılır
          if (!(k === sonKod && simdi - sonGorulme < 1200)) okundu(r.text);
          sonKod = k; sonGorulme = simdi;
        }
      })
      .catch(function () {})
      .then(function () { setTimeout(kareOku, 120); });
  }

  /* ---- Fotoğraftan okuma (yedek yol) ---- */
  function fotoOku(input) {
    var dosya = input.files && input.files[0];
    input.value = '';
    if (!dosya) return;
    if (typeof ZXingWASM === 'undefined') { mesaj('Barkod okuyucu yüklenemedi.', 'hata'); return; }
    mesaj('Fotoğraf okunuyor…', 'bilgi');
    ZXingWASM.readBarcodes(dosya, { formats: FORMATLAR, tryHarder: true, tryRotate: true, maxNumberOfSymbols: 8 })
      .then(function (s) {
        var g = s.filter(function (r) { return r.isValid && r.text; });
        if (!g.length) throw new Error('yok');
        var kayitli = g.filter(function (r) { return bul(r.text); });
        var a = kayitli.length ? kayitli : g;
        if (a.length > 1) {
          var o = function (r) { var p = r.position; return { x: (p.topLeft.x + p.bottomRight.x) / 2, y: (p.topLeft.y + p.bottomRight.y) / 2 }; };
          var mx = 0, my = 0; g.forEach(function (r) { var c = o(r); mx = Math.max(mx, c.x * 2); my = Math.max(my, c.y * 2); });
          a.sort(function (p, q) { var c = o(p), d = o(q); return (Math.pow(c.x - mx / 2, 2) + Math.pow(c.y - my / 2, 2)) - (Math.pow(d.x - mx / 2, 2) + Math.pow(d.y - my / 2, 2)); });
        }
        okundu(a[0].text);
      })
      .catch(function () { sinyal(false); mesaj('Fotoğrafta barkod bulunamadı. Barkodu net ve parlamasız çekin.', 'hata'); });
  }

  /* ================= Liste ================= */
  function listeyiCiz() {
    var tb = el('liste'); tb.innerHTML = '';
    var toplam = 0, uyariVar = false;
    var sayim = durum.mod === 'SAYIM';
    var kaynakYer = (durum.mod === 'GİRİŞ' || sayim) ? null : durum.kaynak;
    durum.liste.forEach(function (s, i) {
      toplam += s.adet;
      var yerStok = stok[s.kod] || {};
      // Sayımda sistem stoğu gösterilmez (kör sayım)
      var bilgi = sayim ? 'sayılan adet →' : (kaynakYer ? (kaynakYer + ': ' + (yerStok[kaynakYer] || 0)) : (durum.hedef + ': ' + (yerStok[durum.hedef] || 0)));
      var uyari = '';
      if (kaynakYer && s.adet > (yerStok[kaynakYer] || 0)) { uyari = '<span class="uyari">⚠ ' + esc(kaynakYer) + '\'da ' + (yerStok[kaynakYer] || 0) + ' adet var</span>'; uyariVar = true; }
      var tr = document.createElement('tr');
      tr.innerHTML = '<td class="ad">' + esc(s.ad) + '<small>' + esc(s.kod) + ' · ' + esc(bilgi) + '</small>' + uyari + '</td>' +
        '<td class="adet"><input type="number" min="' + (sayim ? 0 : 1) + '" step="1" inputmode="numeric" value="' + s.adet + '" onchange="adetDegis(' + i + ', this.value)"></td>' +
        '<td class="sil"><button onclick="satirSil(' + i + ')">✕</button></td>';
      tb.appendChild(tr);
    });
    el('bosListe').style.display = durum.liste.length ? 'none' : 'block';
    el('toplam').textContent = durum.liste.length ? (durum.liste.length + ' çeşit · ' + toplam + ' adet') : '';
    el('kaydetBtn').disabled = !durum.liste.length;
    el('kaydetBtn').textContent = sayim ? 'Sayımı Kaydet' : (uyariVar ? 'Fişi Kaydet (stok yetersiz uyarısı var)' : 'Fişi Kaydet');
    taslakYaz();
  }

  function adetDegis(i, v) {
    var n = parseInt(v, 10), enAz = durum.mod === 'SAYIM' ? 0 : 1;
    if (!(n >= enAz)) { mesaj('Adet en az ' + enAz + ' olmalı. Ürünü çıkarmak için ✕ kullanın.', 'hata'); listeyiCiz(); return; }
    durum.liste[i].adet = n; listeyiCiz();
  }
  function satirSil(i) { durum.liste.splice(i, 1); ekraniKur(); }

  var temizleOnay = 0;
  function listeyiTemizle() {
    if (!durum.liste.length) return;
    if (Date.now() - temizleOnay > 3000) { temizleOnay = Date.now(); mesaj('Listeyi silmek için 3 sn içinde tekrar basın.', 'bilgi'); return; }
    durum.liste = []; temizleOnay = 0; mesaj('Liste temizlendi.', 'bilgi'); ekraniKur();
  }

  /* ================= Kaydet ================= */
  var sayimOnay = 0;
  function kaydet() {
    taslakYaz();
    if (!durum.okutan.trim()) { mesaj('Okutan kişi adını yazın.', 'hata'); el('okutan').focus(); return; }
    if (durum.mod === 'ÇIKIŞ' && !durum.not.trim()) { mesaj('Çıkışta müşteri / sipariş bilgisi zorunlu.', 'hata'); el('not').focus(); return; }
    if (durum.mod === 'TRANSFER' && durum.kaynak === durum.hedef) { mesaj('Nereden ve nereye aynı olamaz.', 'hata'); return; }
    if (durum.mod === 'SAYIM' && Date.now() - sayimOnay > 4000) {
      sayimOnay = Date.now();
      mesaj('Dikkat: Kaydedince listedeki ürünlerin ' + durum.kaynak + ' stoğu sayılan adetlere eşitlenir. Onaylamak için 4 sn içinde tekrar basın.', 'bilgi');
      return;
    }
    sayimOnay = 0;
    var b = el('kaydetBtn'); b.disabled = true; b.textContent = 'Kaydediliyor…';
    api('POST', {
      pin: durum.pin, tur: durum.mod, kaynak: durum.kaynak, hedef: durum.hedef,
      okutan: durum.okutan.trim(), not: durum.not.trim(),
      satirlar: durum.liste.map(function (s) { return { kod: s.kod, barkod: s.barkod, adet: s.adet }; })
    }).then(function (j) {
      var r = j.sonuc;
      stok = r.stok || stok; durum.liste = []; durum.not = '';
      ekraniKur();
      mesaj('Kaydedildi ✓ Fiş No: ' + r.fisNo + ' — ' + r.satirSayisi + ' çeşit, ' + r.toplamAdet + ' adet.', 'ok');
      var ss = el('sayimSonuc');
      if (r.farklar) {
        var farkli = r.farklar.filter(function (f) { return f.fark !== 0; });
        ss.innerHTML = '<strong>Sayım sonucu:</strong> ' + (farkli.length ? farkli.length + ' üründe fark bulundu, stok düzeltildi.' : 'Fark yok, sistem ile sayım tutuyor.') +
          '<div class="farklar">' + farkli.map(function (f) {
            return '<div>' + esc(f.kod) + ': sistem ' + f.sistem + ', sayılan ' + f.sayilan + ' → <b>' + (f.fark > 0 ? '+' : '') + f.fark + '</b></div>';
          }).join('') + '</div>';
        ss.className = 'mesaj bilgi';
      } else ss.className = 'mesaj bilgi gizli';
    }).catch(function (e) {
      listeyiCiz();
      mesaj('KAYDEDİLEMEDİ: ' + e.message + ' — Liste silinmedi, tekrar deneyin.', 'hata');
    });
  }

  /* ================= Raporlar ================= */
  var raporTuru = 'stok', raporVeri = {}, tarihSecim = 'bugun';
  function raporAcKapat() {
    var acik = !el('raporlar').classList.contains('gizli');
    if (acik) { el('raporlar').classList.add('gizli'); el('uygulama').classList.remove('gizli'); return; }
    kameraKapat(); raporVeri = {};
    el('uygulama').classList.add('gizli'); el('raporlar').classList.remove('gizli');
    if (!el('tarihBas').value && tarihSecim !== 'tumu') hizliTarih(tarihSecim, true);
    raporSec(raporTuru);
  }
  function raporSec(t) {
    raporTuru = t;
    document.querySelectorAll('.sekmeler button').forEach(function (b) { b.classList.toggle('secili', b.getAttribute('data-r') === t); });
    el('raporTur').classList.toggle('gizli', t !== 'hareket');
    el('stokFiltre').classList.toggle('gizli', t !== 'stok');
    el('tarihFiltre').classList.toggle('gizli', t === 'stok');
    if (raporVeri[t]) raporCiz(); else raporYukle();
  }

  // ---- Tarih ----
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function hizliTarih(h, yuklemeden) {
    var b = new Date(), s = new Date();
    if (h === 'dun') { b.setDate(b.getDate() - 1); s = new Date(b); }
    if (h === 'hafta') { var g = (b.getDay() + 6) % 7; b.setDate(b.getDate() - g); }
    if (h === 'ay') { b.setDate(1); }
    el('tarihBas').value = h === 'tumu' ? '' : ymd(b);
    el('tarihBit').value = h === 'tumu' ? '' : ymd(s);
    tarihSecim = h;
    document.querySelectorAll('.hizli button').forEach(function (x) { x.classList.toggle('secili', x.getAttribute('data-h') === h); });
    if (!yuklemeden) tarihDegisti(true);
  }
  function tarihDegisti(hizlidan) {
    if (!hizlidan) { tarihSecim = 'ozel'; document.querySelectorAll('.hizli button').forEach(function (x) { x.classList.remove('secili'); }); }
    delete raporVeri.hareket; delete raporVeri.sayim;
    if (raporTuru !== 'stok') raporYukle();
  }
  function tarihMetni() {
    var b = el('tarihBas').value, s = el('tarihBit').value;
    var f = function (x) { return x ? x.split('-').reverse().join('.') : ''; };
    if (!b && !s) return 'tüm tarihler';
    return b === s ? f(b) : (f(b) || '…') + ' – ' + (f(s) || '…');
  }

  // ---- Yükle / çiz ----
  function raporYukle() {
    var t = raporTuru;
    el('raporBilgi').textContent = 'Yükleniyor…'; el('raporListe').innerHTML = ''; el('fisSilBtn').classList.add('gizli');
    var q = '?islem=rapor&tur=' + t + '&pin=' + encodeURIComponent(durum.pin) + '&ypin=' + encodeURIComponent(durum.ypin || '');
    if (t !== 'stok') q += '&bas=' + el('tarihBas').value + '&bit=' + el('tarihBit').value;
    fetch(API_URL + q).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) {
        if (/YÖNETİCİ PIN hatalı/.test(j.hata || '')) {
          var g = prompt('Raporlar için yönetici PIN\'i:');
          if (g) { durum.ypin = g.trim(); taslakYaz(); raporYukle(); return; }
        }
        throw new Error(j.hata);
      }
      raporVeri[t] = j.rapor;
      if (t === 'stok') {
        var yf = el('yerFiltre'), secili = yf.value;
        yf.innerHTML = '<option value="">Tüm yerler</option>' + j.rapor.yerler.map(function (y, i) { return '<option value="' + i + '">' + esc(y) + '</option>'; }).join('');
        yf.value = secili;
      }
      if (t === raporTuru) raporCiz();
    }).catch(function (e) { el('raporBilgi').textContent = 'Rapor alınamadı: ' + e.message; });
  }
  function icerir(ara, alanlar) {
    if (!ara) return true;
    var m = alanlar.join(' ').toLocaleUpperCase('tr');
    return ara.split(/\s+/).every(function (p) { return m.indexOf(p) >= 0; });
  }
  // Ekrandaki filtrelerle eşleşen satırlar (Excel de bunları kullanır)
  function filtreliSatirlar() {
    var r = raporVeri[raporTuru]; if (!r) return [];
    var ara = el('raporAra').value.trim().toLocaleUpperCase('tr');
    if (raporTuru === 'stok') {
      var sadece = el('sadeceStoklu').checked, yi = el('yerFiltre').value;
      return r.satirlar.filter(function (s) {
        var deger = yi === '' ? s.toplam : s.yer[+yi];
        return !(sadece && deger === 0) && icerir(ara, [s.kod, s.ad, s.barkod]);
      });
    }
    if (raporTuru === 'hareket') {
      var tf = el('raporTur').value;
      return r.satirlar.filter(function (s) { return (!tf || s.tur === tf) && icerir(ara, [s.fis, s.kod, s.ad, s.okutan, s.not, s.kaynak, s.hedef, s.tur]); });
    }
    return r.satirlar.filter(function (s) { return icerir(ara, [s.fis, s.kod, s.ad, s.okutan, s.not, s.yer]); });
  }
  function raporCiz() {
    var r = raporVeri[raporTuru]; if (!r) return;
    var liste = filtreliSatirlar(), LIMIT = 300, html = '';
    liste.slice(0, LIMIT).forEach(function (s, i) {
      if (raporTuru === 'stok') {
        var b = r.yerler.concat(['TOPLAM']);
        html += '<div class="rsatir"><div class="ust"><span><b>' + esc(s.kod) + '</b></span></div><div class="alt">' + esc(s.ad) + '</div><div class="yerler">' +
          s.yer.concat([s.toplam]).map(function (v, k) { return '<div>' + esc(b[k]) + '<b' + (v < 0 ? ' class="eksi"' : '') + '>' + v + '</b></div>'; }).join('') + '</div></div>';
      } else if (raporTuru === 'hareket') {
        html += '<div class="rsatir"><div class="ust"><span><span class="rozet ' + esc(s.tur) + '">' + esc(s.tur) + '</span> <b>' + esc(s.kod) + '</b></span><span><b>' + s.adet + ' ad.</b><button class="silbtn" onclick="satirSilRapor(' + i + ')">Sil</button></span></div>' +
          '<div class="alt">' + esc(s.ad) + '</div>' +
          '<div class="alt">' + esc(s.kaynak) + ' → ' + esc(s.hedef) + (s.not ? ' · ' + esc(s.not) : '') + '</div>' +
          '<div class="alt">' + esc(s.tarih) + ' · <span class="fislink" onclick="fisFiltre(\'' + esc(s.fis) + '\')">' + esc(s.fis) + '</span> · ' + esc(s.okutan) + '</div></div>';
      } else {
        html += '<div class="rsatir"><div class="ust"><span><b>' + esc(s.kod) + '</b> · ' + esc(s.yer) + '</span><span><b' + (s.fark < 0 ? ' class="eksi"' : '') + '>' + (s.fark > 0 ? '+' : '') + s.fark + '</b><button class="silbtn" onclick="satirSilRapor(' + i + ')">Sil</button></span></div>' +
          '<div class="alt">' + esc(s.ad) + ' · sistem ' + s.sistem + ' · sayılan ' + s.sayilan + (s.not ? ' · ' + esc(s.not) : '') + '</div>' +
          '<div class="alt">' + esc(s.tarih) + ' · <span class="fislink" onclick="fisFiltre(\'' + esc(s.fis) + '\')">' + esc(s.fis) + '</span> · ' + esc(s.okutan) + '</div></div>';
      }
    });
    if (liste.length > LIMIT) html += '<div class="bos">Ekranda ilk ' + LIMIT + ' sonuç gösteriliyor. Excel dosyasında ' + liste.length + ' satırın tamamı var.</div>';
    el('raporListe').innerHTML = html || '<div class="bos">Kayıt yok.</div>';
    // Bilgi satırı
    if (raporTuru === 'stok') {
      var t = r.yerler.map(function () { return 0; }).concat([0]);
      liste.forEach(function (s) { s.yer.concat([s.toplam]).forEach(function (v, k) { t[k] += v; }); });
      el('raporBilgi').innerHTML = liste.length + ' ürün · ' + r.yerler.concat(['TOPLAM']).map(function (b, k) { return esc(b) + ': <b>' + t[k] + '</b>'; }).join(' · ');
    } else {
      var adet = 0; liste.forEach(function (s) { adet += raporTuru === 'hareket' ? s.adet : 0; });
      el('raporBilgi').textContent = tarihMetni() + ' · ' + liste.length + ' kayıt' + (raporTuru === 'hareket' ? ' · ' + adet + ' adet' : '') +
        (r.toplamSatir > r.satirlar.length ? ' (aralıkta ' + r.toplamSatir + ' kayıt var, son ' + r.satirlar.length + ' tanesi yüklendi; aralığı daraltın)' : '') + ' · Fiş numarasına dokunun: fişin tamamı görünür.';
    }
    // Arama tam bir fiş numarasıysa "fişi sil" düğmesi
    var ara = el('raporAra').value.trim().toUpperCase();
    var tekFis = raporTuru !== 'stok' && /^[GTCS]\d{8}-\d{3}$/.test(ara) && liste.length > 0;
    el('fisSilBtn').classList.toggle('gizli', !tekFis);
    if (tekFis) el('fisSilBtn').textContent = ara + ' fişini tamamen sil (' + liste.length + ' satır)';
  }
  function fisFiltre(f) { el('raporAra').value = f; raporCiz(); window.scrollTo(0, 0); }

  // ---- Silme (yönetici PIN + sebep; kayıt "Silinenler" sayfasına taşınır) ----
  function satirSilRapor(i) {
    var s = filtreliSatirlar()[i]; if (!s) return;
    var tanim = raporTuru === 'hareket'
      ? s.fis + ' · ' + s.tur + ' · ' + s.kod + ' · ' + s.adet + ' adet (' + s.kaynak + ' → ' + s.hedef + ')'
      : s.fis + ' · SAYIM · ' + s.kod + ' · ' + s.yer + ' (sistem ' + s.sistem + ', sayılan ' + s.sayilan + ')';
    silIstegi(s.fis, s.kod, tanim);
  }
  function fisSil() {
    var f = el('raporAra').value.trim().toUpperCase();
    silIstegi(f, '', f + ' fişinin TAMAMI (' + filtreliSatirlar().length + ' satır)');
  }
  function silIstegi(fis, kod, tanim) {
    if (!confirm('Silinecek:\n' + tanim + '\n\nStok buna göre yeniden hesaplanır. Kayıt "Silinenler" sayfasına taşınır. Devam edilsin mi?')) return;
    var sebep = prompt('Silme sebebi (zorunlu):', 'Yanlış okutma');
    if (!sebep || !sebep.trim()) { alert('Sebep yazılmadan silinemez.'); return; }
    var silen = (durum.okutan || '').trim() || (prompt('Adınız:') || '').trim();
    if (!silen) return;
    if (!durum.ypin) { var y = prompt('Yönetici PIN:'); if (!y) return; durum.ypin = y.trim(); taslakYaz(); }
    el('raporBilgi').textContent = 'Siliniyor…';
    api('POST', { islem: 'sil', pin: durum.pin, ypin: durum.ypin, fis: fis, kod: kod, silen: silen, sebep: sebep.trim() })
      .then(function (j) {
        stok = j.sonuc.stok || stok;
        raporVeri = {};
        if (!kod) el('raporAra').value = '';
        raporYukle();
        mesaj('Silindi: ' + tanim, 'ok');
        alert('Silindi ✓ (' + j.sonuc.toplam + ' satır "Silinenler" sayfasına taşındı)');
      })
      .catch(function (e) {
        if (/YÖNETİCİ PIN hatalı/.test(e.message)) { durum.ypin = ''; taslakYaz(); }
        raporCiz();
        alert('SİLİNEMEDİ: ' + e.message);
      });
  }

  // ---- Excel (.xlsx) ----
  var xlsxYukleniyor = null;
  function xlsxHazir() {
    if (window.XLSX) return Promise.resolve();
    if (!xlsxYukleniyor) xlsxYukleniyor = new Promise(function (coz, red) {
      var sc = document.createElement('script');
      sc.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
      sc.onload = coz; sc.onerror = function () { xlsxYukleniyor = null; red(new Error('Excel kütüphanesi yüklenemedi')); };
      document.head.appendChild(sc);
    });
    return xlsxYukleniyor;
  }
  function sayfaEkle(kitap, ad, basliklar, satirlar, genislik) {
    var ws = XLSX.utils.aoa_to_sheet([basliklar].concat(satirlar));
    ws['!cols'] = genislik.map(function (w) { return { wch: w }; });
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: satirlar.length, c: basliklar.length - 1 } }) };
    XLSX.utils.book_append_sheet(kitap, ws, ad);
  }
  function excelIndir() {
    var r = raporVeri[raporTuru];
    if (!r) { alert('Önce rapor yüklenmeli.'); return; }
    var liste = filtreliSatirlar();
    if (!liste.length) { alert('Filtreye uyan kayıt yok.'); return; }
    el('raporBilgi').textContent = 'Excel hazırlanıyor…';
    xlsxHazir().then(function () {
      var wb = XLSX.utils.book_new(), dosya;
      var aralik = (el('tarihBas').value || 'ilk') + '_' + (el('tarihBit').value || 'son');
      if (raporTuru === 'stok') {
        sayfaEkle(wb, 'Stok', ['Stok Kodu', 'Ürün Adı', 'Barkod'].concat(r.yerler).concat(['TOPLAM']),
          liste.map(function (s) { return [s.kod, s.ad, s.barkod].concat(s.yer).concat([s.toplam]); }), [18, 45, 16].concat(r.yerler.map(function () { return 11; })).concat([10]));
        dosya = 'Stok_' + ymd(new Date()) + '.xlsx';
      } else if (raporTuru === 'hareket') {
        var sirali = liste.slice().reverse(); // eskiden yeniye
        sayfaEkle(wb, 'Hareketler', ['Tarih', 'Fiş No', 'Tür', 'Stok Kodu', 'Ürün Adı', 'Adet', 'Nereden', 'Nereye', 'Okutan', 'Müşteri / Not'],
          sirali.map(function (s) { return [s.tarih, s.fis, s.tur, s.kod, s.ad, s.adet, s.kaynak, s.hedef, s.okutan, s.not]; }), [16, 15, 10, 18, 40, 7, 11, 11, 12, 30]);
        // Ürün bazında özet
        var oz = {}, gun = {};
        sirali.forEach(function (s) {
          var o = oz[s.kod] || (oz[s.kod] = { ad: s.ad, g: 0, t: 0, c: 0, sf: 0, se: 0 });
          var d = gun[s.gun] || (gun[s.gun] = { g: 0, t: 0, c: 0, sf: 0, se: 0, fis: {} });
          d.fis[s.fis] = 1;
          var alan = s.tur === 'GİRİŞ' ? 'g' : s.tur === 'TRANSFER' ? 't' : s.tur === 'ÇIKIŞ' ? 'c' : (s.hedef === 'SAYIM' ? 'se' : 'sf');
          o[alan] += s.adet; d[alan] += s.adet;
        });
        sayfaEkle(wb, 'Ürün Özeti', ['Stok Kodu', 'Ürün Adı', 'Giriş', 'Transfer', 'Çıkış', 'Sayım Fazlası', 'Sayım Eksiği'],
          Object.keys(oz).sort().map(function (k) { var o = oz[k]; return [k, o.ad, o.g, o.t, o.c, o.sf, o.se]; }), [18, 45, 8, 9, 8, 13, 13]);
        sayfaEkle(wb, 'Günlük', ['Gün', 'Fiş Sayısı', 'Giriş', 'Transfer', 'Çıkış', 'Sayım Fazlası', 'Sayım Eksiği'],
          Object.keys(gun).sort().map(function (k) { var d = gun[k]; return [k.split('-').reverse().join('.'), Object.keys(d.fis).length, d.g, d.t, d.c, d.sf, d.se]; }), [12, 10, 8, 9, 8, 13, 13]);
        dosya = 'Hareketler_' + aralik + '.xlsx';
      } else {
        sayfaEkle(wb, 'Sayımlar', ['Tarih', 'Fiş No', 'Yer', 'Stok Kodu', 'Ürün Adı', 'Sistem Stoğu', 'Sayılan', 'Fark', 'Okutan', 'Not'],
          liste.slice().reverse().map(function (s) { return [s.tarih, s.fis, s.yer, s.kod, s.ad, s.sistem, s.sayilan, s.fark, s.okutan, s.not]; }), [16, 15, 11, 18, 40, 12, 9, 7, 12, 25]);
        dosya = 'Sayimlar_' + aralik + '.xlsx';
      }
      XLSX.writeFile(wb, dosya.replace(/_ilk_son/, '_tumu'));
      raporCiz();
    }).catch(function (e) { el('raporBilgi').textContent = 'Excel oluşturulamadı: ' + e.message; });
  }

  /* ================= Yardımcılar ================= */
  function el(id) { return document.getElementById(id); }
  function mesaj(m, tip) { var d = el('mesaj'); d.textContent = m; d.className = 'mesaj ' + tip; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var cerceveZaman;
  function cerceveRenk(sinif) { var c = el('cerceve'); c.className = sinif; clearTimeout(cerceveZaman); cerceveZaman = setTimeout(function () { c.className = ''; }, 500); }
  var ses = null;
  function sesHazirla() { try { ses = ses || new (window.AudioContext || window.webkitAudioContext)(); if (ses.state === 'suspended') ses.resume(); } catch (e) {} }
  function sinyal(ok) {
    try { if (navigator.vibrate) navigator.vibrate(ok ? 80 : [200, 100, 200]); } catch (e) {}
    try {
      sesHazirla();
      var o = ses.createOscillator(), g = ses.createGain();
      o.frequency.value = ok ? 1400 : 300; g.gain.value = 0.2;
      o.connect(g); g.connect(ses.destination); o.start(); o.stop(ses.currentTime + (ok ? 0.08 : 0.35));
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) kameraKapat(); });

  taslakOku();
  yerleriDoldur();
  if (durum.pin) yukle(); else girisGoster('');
</script>
